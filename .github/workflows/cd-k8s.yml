name: CD - Build & Deploy to Kubernetes (k3s)

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Azure k3s
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jalvarezza/reproduccion-svc:latest
            ghcr.io/jalvarezza/reproduccion-svc:${{ github.sha }}

      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          printf '%s\n' "$KUBECONFIG_CONTENT" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config set-cluster default --insecure-skip-tls-verify=true

      - name: Deploy manifests to k3s cluster
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl set image deployment/reproduccion-svc reproduccion-svc=ghcr.io/jalvarezza/reproduccion-svc:${{ github.sha }} -n streamverse
          kubectl rollout status deployment/reproduccion-svc -n streamverse --timeout=180s

      - name: Verify deployed resources
        run: |
          kubectl get pods,svc -n streamverse -o wide
