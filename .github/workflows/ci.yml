name: Java CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y verificar cobertura con JaCoCo
        run: mvn clean verify
      
      - name: Construir imagen Docker
        run: docker build -t reproduccion-svc:${{ github.sha }} .
  
      - name: Levantar microservicio con Docker Compose
        run: docker compose up -d --build
      
      - name: Verificar estado del microservicio
        run: |
          for i in {1..12}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' caso03-reproduccion-svc)

            if [ "$STATUS" = "healthy" ]; then
              echo "Microservicio funcionando correctamente"
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "El microservicio no está saludable"
              docker compose logs
              exit 1
            fi

            echo "Esperando inicio del microservicio..."
            sleep 10
          done

          echo "Tiempo de espera agotado"
          docker compose logs
          exit 1
 
