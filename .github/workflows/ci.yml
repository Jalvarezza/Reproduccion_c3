name: Java CI Pipeline

on:
  push:
    branches:
      - develop
      - main
      - feature/compliace-security
  pull_request:
    branches:
      - develop
      - main

jobs:
  security-audit:
    name: Auditoria de seguridad
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7.0.1

      - name: Instalar Gitleaks
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o gitleaks_8.24.3_linux_x64.tar.gz

          curl --proto '=https' --proto-redir '=https' -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt \
            -o gitleaks_checksums.txt

          grep 'gitleaks_8.24.3_linux_x64.tar.gz$' gitleaks_checksums.txt | sha256sum -c -

          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks_8.24.3_linux_x64.tar.gz gitleaks_checksums.txt

      - name: Instalar Trivy
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL \
            https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz \
            -o trivy_0.69.3_Linux-64bit.tar.gz

          curl --proto '=https' --proto-redir '=https' -fsSL \
            https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_checksums.txt \
            -o trivy_checksums.txt

          grep 'trivy_0.69.3_Linux-64bit.tar.gz$' trivy_checksums.txt | sha256sum -c -

          tar -xzf trivy_0.69.3_Linux-64bit.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy
          rm trivy trivy_0.69.3_Linux-64bit.tar.gz trivy_checksums.txt

      - name: Ejecutar auditoria de seguridad
        run: bash audit/security-audit.sh

  build-and-test:
    needs: security-audit
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 LTS
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y verificar cobertura con JaCoCo
        run: mvn -B -s .mvn/settings.xml clean verify

      - name: Analizar codigo con SonarQube Cloud
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true

      - name: Construir imagen Docker
        run: docker build -t duoc/caso03-reproduccion:${{ github.sha }} .

      - name: Levantar microservicio con Docker Compose
        run: |
          docker tag duoc/caso03-reproduccion:${{ github.sha }} duoc/caso03-reproduccion:1.0.0
          docker compose up -d --no-build

      - name: Verificar estado del microservicio
        run: |
          for i in {1..12}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' caso03-reproduccion-svc)

            if [ "$STATUS" = "healthy" ]; then
              echo "Microservicio funcionando correctamente"
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "El microservicio no está saludable"
              docker compose logs
              exit 1
            fi

            echo "Esperando inicio del microservicio..."
            sleep 10
          done

          echo "Tiempo de espera agotado"
          docker compose logs
          exit 1

  deploy:
    needs: [security-audit, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/cd-k8s.yml
    secrets: inherit
