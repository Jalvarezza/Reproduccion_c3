services:
  reproduccion-svc:
    build: .
    image: duoc/caso03-reproduccion:1.0.0
    container_name: caso03-reproduccion-svc
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    user: "appuser"

    # Seteamos limites explicitos para simular el comportamiento cloud
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

# Healthcheck basico contra el Actuator de Spring
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s