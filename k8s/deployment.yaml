apiVersion: apps/v1
kind: Deployment
metadata:
  name: reproduccion-svc
  namespace: streamverse
  labels:
    app: reproduccion-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reproduccion-svc
  template:
    metadata:
      labels:
        app: reproduccion-svc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: reproduccion-svc
          image: ghcr.io/jalvarezza/reproduccion-svc:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: reproduccion-config
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
